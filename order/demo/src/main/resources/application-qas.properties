#spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.security.protocol=SASL_SSL
#spring.kafka.properties.sasl.jaas.config=${KAFKA_JAAS_CONFIG}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="appuser" password="appuser123";
spring.kafka.properties.sasl.mechanism=PLAIN
#spring.kafka.ssl.trust-store-location=${KAFKA_TRUSTSTORE_LOCATION}
spring.kafka.ssl.trust-store-location=file:C:/Users/Edilson/Documents/microservicos-eccomerce/chavekeystoredev2/kafka.truststore.jks
#spring.kafka.ssl.trust-store-password=${KAFKA_TRUSTSTORE_PASSWORD}
spring.kafka.ssl.trust-store-password=123456
spring.kafka.properties.ssl.endpoint.identification.algorithm=

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
    # Opção B: se realmente quer String cru, troca o deserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.properties.spring.json.value.default.type=com.example.demo.domain.order.dto.CarrinhoEvent

spring.kafka.consumer.properties.spring.json.value.default.type=com.example.demo.application.dto.order.CarEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.group-id=group-order-car
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.demo.*